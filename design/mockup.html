<title>Pilzdex UX Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout idea: web = an open two-panel Pokédex (left: the device with a debloated screen, right: a context panel
   with its own LCD, finds keys and stepping buttons); phone = the single device as shipped today. One visual world,
   deliberately single-theme (device red on teal), so every colour is set explicitly. */
:root{
  --red:#d9262b; --red-dark:#8f1117; --red-deep:#b81c21; --ink:#160b0b;
  --lcd:#bcd583; --lcd-2:#a2c066; --lcd-ink:#1c2a10; --lcd-dim:#5d7240;
  --bezel:#eceae3; --blue:#3d9ce6; --blue-dark:#1d5f9c; --key:#2f6fd6; --key-dark:#1c4a99;
  --yellow:#ffd84a; --yellow-dark:#b97800;
  --ed:#2f8a3b; --none:#6d6d6d; --tox:#e08a12; --dead:#111;
  --stage:#1c5864;
  --font-lcd:'VT323', ui-monospace, Menlo, monospace;
  --font-label:'Press Start 2P', ui-monospace, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(160deg,var(--stage),#6fbcad 55%,#d5efbd);font-family:var(--font-lcd);color:var(--ink);overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,label:focus-within{outline:3px solid #ffe14d;outline-offset:2px}

.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.viewbar{display:flex;gap:8px;align-items:center;font-family:var(--font-label);font-size:8px;color:#eaf6f2}
.viewbar .seg{display:flex;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:#0f3a42}
.viewbar .seg button{border:0;background:transparent;color:#cfe;padding:6px 12px;font-family:var(--font-label);font-size:8px}
.viewbar .seg button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.viewbar .seg button:disabled{opacity:.4;cursor:default}
.viewbar .hint{opacity:.85}

/* ---------- the book ---------- */
.book{display:flex;align-items:stretch;height:min(100%,760px);min-height:0;flex:1 1 auto;max-height:760px}
.dev{grid-template-columns:minmax(0,1fr);background:var(--red);border:3px solid var(--ink);display:grid;gap:10px;padding:12px 14px 16px;position:relative;min-width:0;min-height:0}
.left{width:min(100%,430px);border-radius:20px;grid-template-rows:auto 1fr auto;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.hinge,.right{display:none}
.book.wide .left{width:430px;border-radius:20px 6px 6px 20px;border-right-width:2px}
.book.wide .hinge{display:flex;flex-direction:column;width:26px;background:linear-gradient(90deg,var(--red-dark),var(--red) 45%,var(--red-dark));
  border-block:3px solid var(--ink);margin-top:calc(var(--rtop,90px) + 14px);margin-bottom:14px} /* within both panels' height */
.hinge i{flex:1;border-bottom:3px solid var(--ink)}.hinge i:last-child{border-bottom:0}
.book.wide .right{display:grid;width:430px;border-radius:6px 20px 20px 6px;border-left-width:2px;margin-top:var(--rtop,90px);
  grid-template-rows:auto 1fr auto auto;box-shadow:0 18px 40px rgba(0,0,0,.35)}

/* ---------- left device ---------- */
.top{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:3px solid var(--ink)}
.lens{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 35% 35%,#bfe6ff 0 12%,var(--blue) 30%,var(--blue-dark) 100%);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ink);margin:6px}
.leds{display:flex;gap:7px;align-self:flex-start;margin-top:6px}
.led{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.led.r{background:#ff5146}.led.y{background:#ffd34d}.led.g{background:#5fd068}
.spacer{flex:1}
.tag{font-family:var(--font-label);font-size:7px;color:#ffe3e3;line-height:1.7;text-align:right}
.tag b{display:inline-block;background:var(--yellow);color:var(--ink);padding:2px 4px;border-radius:3px;font-weight:400}
.iconbtn{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:#2a2a2a;color:#fff;display:grid;place-items:center;font-size:22px}
.bezel{background:var(--bezel);border:3px solid var(--ink);border-radius:8px 8px 8px 36px;padding:10px 12px 28px;min-height:0;display:flex;flex-direction:column;position:relative}
.bezel-dots{display:flex;gap:10px;justify-content:center;margin-bottom:8px}
.bezel-dots i{width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--ink)}
.bezel-foot{position:absolute;left:16px;right:16px;bottom:6px;display:flex;justify-content:space-between;align-items:center}
.bezel-foot .dot{width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid var(--ink)}
.bezel-foot .grill{width:22px;height:12px;background:repeating-linear-gradient(var(--ink) 0 2px,transparent 2px 5px)}
.lcd{flex:1;min-height:0;min-width:0;background:linear-gradient(135deg,var(--lcd),var(--lcd-2));border:3px solid var(--ink);border-radius:4px;color:var(--lcd-ink);font-size:20px;line-height:1.1;position:relative;display:flex;flex-direction:column;overflow:hidden}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.26) 0 16%,transparent 16% 100%)}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 10px 10px}
.controls{display:grid;grid-template-columns:1fr 126px;gap:10px;align-items:center}
.cl{display:grid;gap:10px}
.btnrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.hw{display:grid;justify-items:center;gap:4px;background:none;border:0;padding:0;position:relative}
.hw small{font-family:var(--font-label);font-size:7px;color:#ffe3e3}
.catchbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.biground{width:78px;height:78px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 35% 28%,#fff8cf 0 9%,var(--yellow) 30%,#f5ad00 72%,var(--yellow-dark));box-shadow:0 5px 0 var(--red-dark);font-family:var(--font-label);font-size:9px;color:var(--ink)}
.biground.long{font-size:7px}
.round{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 35% 30%,#e8f6ff 0 10%,#7cc3f6 25%,var(--blue) 55%,var(--blue-dark));box-shadow:0 4px 0 var(--red-dark);display:grid;place-items:center}
.round svg{width:20px;height:20px}
.counter{background:linear-gradient(135deg,var(--lcd),var(--lcd-2));border:3px solid var(--ink);border-radius:4px;text-align:center;font-size:24px;color:var(--lcd-ink);padding:4px 2px;font-variant-numeric:tabular-nums;min-width:0}
.counter small{display:block;font-size:14px;color:var(--lcd-dim)}
.pill{width:100%;height:30px;border-radius:15px;border:3px solid var(--ink);font-family:var(--font-label);font-size:8px;color:#fff;box-shadow:0 3px 0 var(--red-dark);background:#ff4b3f}
.pill:disabled{opacity:.45;cursor:default}
.book.wide .pill{visibility:hidden}
.dpad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);justify-content:center}
.dpad button{background:#262626;border:0;color:#eee;font-size:16px;display:grid;place-items:center}
.dpad .u{grid-area:1/2;border-radius:6px 6px 0 0}.dpad .l{grid-area:2/1;border-radius:6px 0 0 6px}
.dpad .c{grid-area:2/2;font-family:var(--font-label);font-size:7px}.dpad .r{grid-area:2/3;border-radius:0 6px 6px 0}
.dpad .d{grid-area:3/2;border-radius:0 0 6px 6px}

/* ---------- right panel ---------- */
.rtop{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:3px solid var(--ink)}
.rtop .leds{margin:0;align-self:center}
.rtop .label{font-family:var(--font-label);font-size:8px;color:#ffe3e3;letter-spacing:.5px}
.rlcd{min-width:0;border:3px solid var(--ink);border-radius:6px;background:var(--bezel);padding:8px;min-height:0;display:flex}
.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.key{aspect-ratio:1/1;border:3px solid var(--ink);border-radius:4px;background:linear-gradient(160deg,#5aa0ff,var(--key) 45%,var(--key-dark));padding:0;overflow:hidden;position:relative;display:grid;place-items:center}
.key svg{width:85%;height:85%}
.key.photo{background:linear-gradient(170deg,#7e9a5a,#2a3a1c)}
.key .kd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1.3;text-align:center}
.key:disabled{cursor:default}
.keyslabel{display:flex;justify-content:space-between;font-family:var(--font-label);font-size:7px;color:#ffe3e3;margin-bottom:6px}
.rbottom{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.ybtn{height:44px;border:3px solid var(--ink);border-radius:8px;background:linear-gradient(180deg,#ffe57a,#f5b400);box-shadow:0 4px 0 var(--red-dark);font-family:var(--font-label);font-size:8px;color:var(--ink)}
.ybtn:disabled{opacity:.45;cursor:default}
.rnum{min-width:84px;text-align:center;background:linear-gradient(135deg,var(--lcd),var(--lcd-2));border:3px solid var(--ink);border-radius:4px;padding:4px 8px;font-size:22px;color:var(--lcd-ink);font-variant-numeric:tabular-nums}

/* ---------- LCD content ---------- */
.titlebar{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--lcd-ink);padding:6px 10px;font-family:var(--font-label);font-size:10px;line-height:1.5}
.titlebar .name{min-width:0;overflow-wrap:break-word}
.sub{color:var(--lcd-dim);font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px;align-items:center}
.chips.one{flex-wrap:nowrap;gap:4px}
.chips.one .chip{font-size:17px;padding:0 5px}.chips.one .chip.icon{padding:0 3px}
.chip{border:2px solid var(--lcd-ink);background:transparent;border-radius:3px;padding:0 7px;font-size:18px;line-height:1.3;color:var(--lcd-ink);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip[aria-pressed="true"],.chip.on{background:var(--lcd-ink);color:var(--lcd)}
.chip.off{opacity:.4}
.chip.icon{padding:0 4px}
.sep{width:2px;align-self:stretch;background:var(--lcd-dim);opacity:.5}
.ed{display:inline-grid;place-items:center;width:20px;height:20px}.ed svg{width:20px;height:20px}
.edpill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:4px;padding:1px 8px;color:#fff;font-family:var(--font-label);font-size:8px;line-height:2}
.edpill.edible{background:var(--ed)}.edpill.none{background:var(--none)}.edpill.toxic{background:var(--tox)}.edpill.deadly{background:var(--dead)}
.edpill svg{width:16px;height:16px}
.edpill.big{font-size:10px;padding:4px 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.book.wide .grid.dex{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{display:grid;gap:4px;padding:6px;background:rgba(255,255,255,.22);border:2px solid var(--lcd-ink);border-radius:4px;color:var(--lcd-ink);text-align:center;min-width:0}
.tile.got{background:rgba(255,255,255,.5)}
.tile.x{border-style:dashed}
.thead{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--lcd-dim)}
.thead .ed svg{width:18px;height:18px}
.tart{aspect-ratio:1/1;display:grid;place-items:center;border-radius:3px;overflow:hidden}
.tart svg{width:82%;height:82%}
.tile.got .tart{background:linear-gradient(170deg,#7e9a5a,#2a3a1c)}
.tname{font-size:15px;line-height:1.1;height:2.2em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.exhead{font-family:var(--font-label);font-size:8px;font-weight:400;line-height:1.6;margin:12px 0 6px}
.pic{position:relative;aspect-ratio:1/1;margin:0 auto 8px;width:100%;max-width:340px;border:2px solid var(--lcd-ink);border-radius:3px;background:#dfe8c8;display:grid;place-items:center;overflow:hidden}
.pic.photo{background:linear-gradient(170deg,#7e9a5a,#3e5a2c 60%,#2a3a1c)}
.pic svg{width:72%;height:72%}.pic img{width:100%;height:100%;object-fit:cover}
.pic .stamp{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:15px;padding:0 6px;border-radius:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.latin{font-style:italic;color:var(--lcd-dim);font-size:19px}
.box{border:2px solid var(--lcd-ink);border-radius:3px;padding:6px 8px;margin-bottom:8px;background:rgba(255,255,255,.18)}
.box h3{margin:0 0 4px;font-family:var(--font-label);font-size:8px;line-height:1.6;font-weight:400}
.stat{display:flex;gap:4px}
.stat span:nth-child(2){flex:1;border-bottom:2px dotted var(--lcd-dim);margin-bottom:5px}
.stat b{font-weight:400;font-variant-numeric:tabular-nums;text-align:right}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;align-items:end;height:30px;margin:2px 0 2px;border-bottom:2px solid var(--lcd-ink)}
.bars i{display:block;background:var(--lcd-dim);opacity:.45}.bars i.on{background:var(--lcd-ink);opacity:1}
.mlabels{display:grid;grid-template-columns:repeat(12,1fr);font-size:12px;color:var(--lcd-dim);text-align:center;margin-bottom:6px}
.look{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lk{background:rgba(255,255,255,.25);border:2px solid var(--lcd-ink);border-radius:3px;padding:4px;display:grid;justify-items:center;gap:2px;text-align:center;font-size:15px;line-height:1.05;color:var(--lcd-ink);min-width:0}
.lk svg.art{width:46px;height:46px}.lk span{max-width:100%;overflow-wrap:break-word}
.lk .roman{font-family:var(--font-label);font-size:7px;color:var(--lcd-dim)}
.prog{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:18px}
.prog .bar{height:10px;border:2px solid var(--lcd-ink);border-radius:2px;position:relative;background:rgba(255,255,255,.3)}
.prog .bar i{position:absolute;inset:0 auto 0 0;background:var(--lcd-ink)}
.field{display:grid;gap:2px;margin-bottom:8px;font-size:18px}
.field select{font-size:20px;background:rgba(255,255,255,.45);border:2px solid var(--lcd-ink);border-radius:3px;padding:4px 6px;color:var(--lcd-ink);width:100%}
.cta{width:100%;font-family:var(--font-label);font-size:10px;background:var(--lcd-ink);color:var(--lcd);border:0;border-radius:3px;padding:10px;line-height:1.5}
.cta.ghost{background:transparent;color:var(--lcd-ink);border:2px solid var(--lcd-ink)}
.seg2{display:flex;border:2px solid var(--lcd-ink);border-radius:3px;overflow:hidden;margin-bottom:6px}
.seg2 button{flex:1;background:transparent;border:0;padding:4px;font-size:19px;color:var(--lcd-ink)}
.seg2 button[aria-pressed="true"]{background:var(--lcd-ink);color:var(--lcd)}
.guess{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;border:2px solid var(--lcd-ink);border-radius:3px;background:transparent;color:var(--lcd-ink);font-size:18px;padding:3px 8px;margin-bottom:4px}
.guess[aria-pressed="true"]{background:var(--lcd-ink);color:var(--lcd)}
.warnbox{background:#f6d27a;border-color:#7a4a00}
.note{font-size:15px;color:var(--lcd-dim);margin:6px 0 0}
.empty{color:var(--lcd-dim);font-size:17px;margin:0}
.callout{font-family:var(--font-label);font-size:7px;line-height:1.7;color:var(--lcd-dim);border-top:2px dashed var(--lcd-dim);padding-top:6px;margin-top:8px}
.shot{border:2px solid var(--lcd-ink);border-radius:3px;display:block;width:100%;max-width:340px;margin:0 auto 8px;aspect-ratio:1/1;padding:0;background:linear-gradient(170deg,#7e9a5a,#2a3a1c);position:relative;overflow:hidden}
.shot svg{width:72%;height:72%}.shot img{width:100%;height:100%;object-fit:cover}
.shot .stamp{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:15px;padding:0 6px;border-radius:3px}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--lcd-ink);color:var(--lcd);font-family:var(--font-label);font-size:11px;padding:12px 16px;border-radius:4px;z-index:5;white-space:nowrap}

@media (max-width:899px){.viewbar .hint{display:none}}
@media (max-width:440px){.stage{padding:0;gap:0}.viewbar{display:none}.book{height:100%;max-height:none}.left{width:100%;border-radius:0;border-width:0}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div class="stage">
  <div class="viewbar" role="group" aria-label="Preview">
    <span>PREVIEW</span>
    <span class="seg"><button id="vWide" aria-pressed="true">WEB</button><button id="vPhone" aria-pressed="false">PHONE</button></span>
    <span class="hint" id="vHint">two panels from 900 px wide</span>
  </div>

  <div class="book" id="book">
    <!-- LEFT: the device as today, with a debloated screen in web mode -->
    <section class="dev left" aria-label="Pilzdex">
      <header class="top">
        <div class="lens" aria-hidden="true"></div>
        <div class="leds" aria-hidden="true"><i class="led r"></i><i class="led y"></i><i class="led g"></i></div>
        <div class="spacer"></div>
        <div class="tag"><b>MOCK DATA</b><br>design</div>
        <button class="iconbtn" id="menuBtn" aria-label="Settings">&#8801;</button>
      </header>
      <section class="bezel">
        <div class="bezel-dots" aria-hidden="true"><i></i><i></i></div>
        <div class="lcd" id="lcdL"></div>
        <div class="bezel-foot" aria-hidden="true"><span class="dot"></span><span class="grill"></span></div>
      </section>
      <footer class="controls">
        <div class="cl">
          <div class="btnrow">
            <label class="hw catchbtn"><span class="biground" id="lblA">CATCH</span>
              <input type="file" accept="image/*" id="catchInput" aria-label="Catch"></label>
            <div class="counter" id="counter"></div>
            <button class="hw" id="btnB"><span class="round"><svg viewBox="0 0 24 24" fill="none" stroke="#10324f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6l-6 6 6 6M4 12h16"/></svg></span><small id="lblB">BACK</small></button>
          </div>
          <button class="pill" id="pillPage">PAGE</button>
        </div>
        <div class="dpad" role="group" aria-label="D-pad">
          <button class="u" id="dU" aria-label="Up">&#9650;</button>
          <button class="l" id="dL" aria-label="Previous">&#9664;</button>
          <button class="c" id="dC" aria-label="OK">OK</button>
          <button class="r" id="dR" aria-label="Next">&#9654;</button>
          <button class="d" id="dD" aria-label="Down">&#9660;</button>
        </div>
      </footer>
    </section>

    <div class="hinge" aria-hidden="true"><i></i><i></i><i></i></div>

    <!-- RIGHT: context panel (web only) -->
    <section class="dev right" aria-label="Details panel">
      <header class="rtop">
        <span class="label" id="rLabel">INFO</span>
      </header>
      <div class="rlcd"><div class="lcd" id="lcdR"></div></div>
      <div>
        <div class="keyslabel"><span id="keysTitle">MES TROUVAILLES</span><span id="keysCount"></span></div>
        <div class="keys" id="keys"></div>
      </div>
      <div class="rbottom">
        <button class="ybtn" id="yPrev">&#9664; PREV</button>
        <div class="rnum" id="rnum">–</div>
        <button class="ybtn" id="yNext">NEXT &#9654;</button>
      </div>
    </section>
  </div>
</div>

<script>
const T={
fr:{dex:"PILZDEX",caught:"attrapés",all:"Tous",got:"Attrapés",missing:"Manquants",catch:"ATTRAPER",back:"RETOUR",page:"PAGE",
 season:"Saison",cap:"Chapeau",spores:"Sporée",where:"Où le trouver",look:"Sosies",finds:"MES TROUVAILLES",recent:"DERNIÈRES PRISES",
 filters:"Filtres",progress:"Progression",byEd:"Par comestibilité",regions:"Régions",settings:"Réglages",language:"Langue",view:"Affichage",
 grid:"Grille",list:"Liste",account:"Compte",signout:"Se déconnecter",edible:"Comestible",none:"Sans intérêt",toxic:"Toxique",deadly:"Mortel",
 allYear:"toute l'année",exHead:"Sosies hors Pilzdex",exTag:"hors Pilzdex",tapToCatch:"Touche pour attraper",

<script>
/* ---------- helpers ---------- */
const ROM=["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
const MON={fr:["JANV","FÉVR","MARS","AVR","MAI","JUIN","JUIL","AOÛT","SEPT","OCT","NOV","DÉC"],en:["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"],de:["JAN","FEB","MÄR","APR","MAI","JUN","JUL","AUG","SEP","OKT","NOV","DEZ"]};
function months(sp){ if(!sp.season||sp.season==="?")return []; const [a,b]=sp.season.split("–").map(r=>ROM.indexOf(r)+1); const out=[]; for(let m=a;;m=m%12+1){out.push(m);if(m===b||out.length>12)break;} return out; }
function hist(ms){ const h=Array(12).fill(0); ms.forEach((m,i)=>{h[m-1]=Math.round(100*Math.sin(Math.PI*(i+1)/(ms.length+1)))+10}); return h; }
const seasonLabel=(ms,l)=>!ms.length?"–":ms.length>=12?T[l].allYear:`${MON[l][ms[0]-1]}–${MON[l][ms[ms.length-1]-1]}`;
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fill=(s,v)=>s.replace(/\{(\w+)\}/g,(_,k)=>v[k]??"");

const S={lang:store.get("pzm.lang","fr"),mode:store.get("pzm.mode","grid"),view:"index",cur:2,page:0,filter:"all",edf:null,stack:[],prev:"index",
  wide:store.get("pzm.wide",null),draft:null,draftSp:null,catchFor:null,
  finds:{2:[{date:"2026-09-14"}],3:[{date:"2026-07-22"},{date:"2026-08-30"},{date:"2026-10-12"}],7:[{date:"2026-10-03"}],1:[{date:"2026-10-20"}]}};
const t=k=>T[S.lang][k]??k;
const caught=id=>(S.finds[id]||[]).length>0;
const nm=sp=>sp.n[S.lang];
const no=id=>id>100?"EX-"+String(id-100).padStart(2,"0"):"No. "+String(id).padStart(3,"0");
const short=id=>id>100?"EX"+(id-100):String(id).padStart(3,"0");
const byId=id=>ALL.find(x=>x.id===id);
const looksOf=sp=>[...new Set([...sp.look,...ALL.filter(x=>x.look.includes(sp.id)).map(x=>x.id)])].map(byId);
const visible=()=>D.filter(sp=>(S.filter==="all"||(S.filter==="got"?caught(sp.id):!caught(sp.id)))&&(!S.edf||sp.ed===S.edf));
const $=id=>document.getElementById(id);
const canWide=()=>innerWidth>=900;
const isWide=()=>canWide()&&S.wide!==false;
const edPill=(ed,big)=>`<span class="edpill ${ed}${big?" big":""}">${ED[ed]}${esc(t(ed))}</span>`;

/* ---------- pieces ---------- */
const tile=sp=>`<button class="tile ${caught(sp.id)?"got":""} ${sp.extra?"x":""}" data-open="${sp.id}"><span class="thead"><span>${short(sp.id)}</span><span class="ed">${ED[sp.ed]}</span></span><span class="tart">${art(sp.shape,sp.c,!caught(sp.id),sp.plain)}</span><span class="tname">${esc(nm(sp))}</span></button>`;
const filters=()=>`<div class="chips one">${["all","got","missing"].map(f=>`<button class="chip" data-filter="${f}" aria-pressed="${S.filter===f}">${esc(t(f))}</button>`).join("")}<span class="sep"></span>${["edible","none","toxic","deadly"].map(e=>`<button class="chip icon" data-edf="${e}" aria-pressed="${S.edf===e}" title="${esc(t(e))}"><span class="ed">${ED[e]}</span></button>`).join("")}</div>`;
function picture(sp,hint){ const f=(S.finds[sp.id]||[])[0];
  if(f) return `<button class="shot" data-recrop="${sp.id}">${art(sp.shape,sp.c,false,sp.plain)}<span class="stamp">${esc(f.date)}</span></button>`;
  return `<label class="pic">${art(sp.shape,sp.c,true)}<span class="stamp">${esc(hint)}</span><input type="file" accept="image/*" data-catchfor="${sp.id}" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>`; }
function statsBox(sp){ const ms=months(sp),h=hist(ms),mx=Math.max(1,...h);
  return `<div class="box"><div class="stat"><span>${esc(t("season"))}</span><span></span><b>${esc(seasonLabel(ms,S.lang))}</b></div>
   <div class="bars">${h.map((v,i)=>`<i class="${ms.includes(i+1)?"on":""}" style="height:${Math.max(4,v/mx*100)}%"></i>`).join("")}</div>
   <div class="mlabels">${MON[S.lang].map(m=>`<span>${m[0]}</span>`).join("")}</div>
   <div class="stat"><span>${esc(t("cap"))}</span><span></span><b>${esc(sp.cap)}</b></div>
   <div class="stat"><span>${esc(t("spores"))}</span><span></span><b>${esc(sp.spores[S.lang])}</b></div></div>`; }
const whereBox=sp=>`<div class="box"><h3>${esc(t("where"))}</h3><div class="chips">${["BER","GRE"].map(r=>`<span class="chip ${sp.reg.includes(r)?"on":"off"}">${r==="BER"?"Berlin":"Grenoble"}</span>`).join("")}</div>${esc(sp.how[S.lang])}</div>`;
function lookBox(sp,roman){ const L=looksOf(sp); if(!L.length)return "";
  return `<div class="box"><h3>${esc(t("look"))}</h3><div class="look">${L.slice(0,3).map((x,i)=>`<button class="lk" data-open="${x.id}" data-push="1">${roman?`<span class="roman">${ROM[i]}</span>`:""}${art(x.shape,x.c,!caught(x.id),x.plain)}<span>${esc(nm(x))}</span><span class="ed">${ED[x.ed]}</span></button>`).join("")}</div></div>`; }

/* ---------- views: left screen ---------- */
function leftIndex(){ const list=visible(), n=D.filter(x=>caught(x.id)).length;
  return `<div class="titlebar"><span>${t("dex")}</span><span>${n}/30</span></div><div class="scroll">
   ${isWide()?"":filters()}
   <div class="grid dex">${list.map(tile).join("")}</div>
   <h3 class="exhead">${esc(t("exHead"))} (${EX.length})</h3><div class="grid dex">${EX.map(tile).join("")}</div></div>`; }
function leftEntry(){ const sp=byId(S.cur); const head=`<div class="titlebar"><span class="name">${esc(nm(sp))}</span><span>${no(sp.id)}</span></div>`;
  const p1=`${picture(sp,t("tapToCatch"))}<div class="meta">${edPill(sp.ed)}${sp.extra?`<span class="chip">${esc(t("exTag"))}</span>`:""}<span class="latin">${esc(sp.latin)}</span></div><div class="box">${esc(sp.desc[S.lang])}</div>`;
  if(isWide()||S.page===0) return head+`<div class="scroll">${p1}</div>`;
  return head+`<div class="scroll">${statsBox(sp)}${whereBox(sp)}${lookBox(sp,false)}${findsList(sp)}</div>`; }
function findsList(sp){ const fs=S.finds[sp.id]||[]; return `<div class="box"><h3>${esc(t("finds"))} (${fs.length})</h3>${fs.length?fs.map(f=>`<div class="stat"><span>${esc(f.date)}</span><span></span><b>📍</b></div>`).join(""):`<p class="empty">${esc(t("noFinds"))}</p>`}</div>`; }
function leftCatch(){ const sp=byId(S.draftSp??S.catchFor??2);
  return `<div class="titlebar"><span>${esc(t("catch"))}</span>${S.catchFor?`<span class="name">${esc(nm(byId(S.catchFor)))}</span>`:""}</div><div class="scroll">
   <label class="shot">${S.draft?`<img src="${esc(S.draft)}" alt="">`:art(sp.shape,sp.c,false,sp.plain)}<span class="stamp">${esc(t("tapPhoto"))}</span><input type="file" accept="image/*" id="rePick" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>
   ${isWide()?"":catchForm()}</div>`; }
function catchForm(){ const verify=S.catchFor!=null, sel=byId(S.draftSp);
  const guesses=[[sel?.id===2?103:2,.58],[3,.21],[104,.09]];
  let html="";
  if(verify){ const y=byId(103); if(!S.dismissed&&S.draftSp===S.catchFor&&S.catchFor===2) html+=`<div class="box warnbox"><p style="margin:0 0 6px">${esc(fill(t("areYouSure"),{x:nm(sel),y:nm(y),p:"72%"}))}</p><div class="chips"><button class="chip" data-pick="103">${esc(fill(t("switchTo"),{y:nm(y)}))}</button><button class="chip" data-dismiss="1">${esc(fill(t("keep"),{x:nm(sel)}))}</button></div></div>`; }
  else html+=`<div class="box"><h3>${esc(t("suggestion"))}</h3><p style="margin:0 0 4px">${esc(t("notSure"))}</p>${guesses.map(([id,p])=>`<button class="guess" data-pick="${id}" aria-pressed="${S.draftSp===id}"><span class="ed">${ED[byId(id).ed]}</span><span>${esc(nm(byId(id)))}</span><b style="font-weight:400">${Math.round(p*100)}%</b></button>`).join("")}</div>`;
  return html+`<div class="field"><label for="spc">${esc(t("species"))}</label><select id="spc">${ALL.map(s=>`<option value="${s.id}" ${s.id===S.draftSp?"selected":""}>${no(s.id)} ${esc(nm(s))}</option>`).join("")}</select></div>
   <button class="cta" data-save="1">${esc(t("save"))}</button>`; }
function leftSettings(){ return `<div class="titlebar"><span>${esc(t("settings"))}</span></div><div class="scroll">${settingsBody()}</div>`; }
function settingsBody(){ return `<div class="box"><h3>${esc(t("language"))}</h3><div class="seg2">${["fr","en","de"].map(l=>`<button data-lang="${l}" aria-pressed="${S.lang===l}">${l.toUpperCase()}</button>`).join("")}</div></div>
  <div class="box"><h3>${esc(t("view"))}</h3><div class="seg2">${["grid","list"].map(m=>`<button data-mode="${m}" aria-pressed="${S.mode===m}">${esc(t(m))}</button>`).join("")}</div></div>
  <div class="box"><h3>${esc(t("account"))}</h3><p style="margin:0 0 8px">sam@example.com</p><button class="cta">${esc(t("signout"))}</button></div>`; }

/* ---------- views: right panel (web) ---------- */
function rightIndex(){ const n=D.filter(x=>caught(x.id)).length;
  const by=["edible","none","toxic","deadly"].map(e=>[e,D.filter(s=>s.ed===e).length,D.filter(s=>s.ed===e&&caught(s.id)).length]);
  return `<div class="titlebar"><span>${esc(t("filters"))}</span><span>${visible().length}</span></div><div class="scroll">${filters()}
   <div class="box"><h3>${esc(t("progress"))}</h3><div class="prog"><span>${n}/30</span><span class="bar"><i style="width:${n/30*100}%"></i></span><span>${Math.round(n/30*100)}%</span></div></div>
   <div class="box"><h3>${esc(t("byEd"))}</h3><div class="prog">${by.map(([e,tot,got])=>`<span class="ed">${ED[e]}</span><span class="bar"><i style="width:${tot?got/tot*100:0}%"></i></span><span>${got}/${tot}</span>`).join("")}</div></div>
   <div class="box"><h3>${esc(t("regions"))}</h3><div class="prog">${["BER","GRE"].map(r=>{const tot=D.filter(s=>s.reg.includes(r)).length,got=D.filter(s=>s.reg.includes(r)&&caught(s.id)).length;return `<span>${r==="BER"?"Berlin":"Grenoble"}</span><span class="bar"><i style="width:${got/tot*100}%"></i></span><span>${got}/${tot}</span>`}).join("")}</div></div>
   <p class="callout">${esc(t("panelIdx"))}</p></div>`; }
function rightEntry(){ const sp=byId(S.cur);
  return `<div class="titlebar"><span>${no(sp.id)}</span>${edPill(sp.ed)}</div><div class="scroll">${statsBox(sp)}${whereBox(sp)}${lookBox(sp,true)}<p class="callout">${esc(t("panelEntry"))}</p></div>`; }
function rightCatch(){ return `<div class="titlebar"><span>${esc(t("suggestion"))}</span></div><div class="scroll">${catchForm()}</div>`; }
function rightSettings(){ return `<div class="titlebar"><span>${esc(t("settings"))}</span></div><div class="scroll">${settingsBody()}</div>`; }

function keys(){ let items, title;
  if(S.view==="entry"){ const sp=byId(S.cur); title=t("finds"); items=(S.finds[sp.id]||[]).map(f=>({sp,date:f.date})); }
  else { title=t("recent"); items=Object.entries(S.finds).flatMap(([id,fs])=>fs.map(f=>({sp:byId(+id),date:f.date}))).sort((a,b)=>b.date.localeCompare(a.date)); }
  $("keysTitle").textContent=title; $("keysCount").textContent=items.length?String(items.length):"";
  $("keys").innerHTML=Array.from({length:10},(_,i)=>{const it=items[i];
    return it?`<button class="key photo" data-open="${it.sp.id}" title="${esc(nm(it.sp))} · ${esc(it.date)}">${art(it.sp.shape,it.sp.c,false,it.sp.plain)}<span class="kd">${esc(it.date.slice(5))}</span></button>`:`<button class="key" disabled aria-label="empty"></button>`}).join(""); }

/* ---------- render ---------- */
function render(){
  const wide=isWide(); $("book").classList.toggle("wide",wide);
  // right panel starts on the line under the left header, so the two halves look like they fit together when closed
  if(wide){ const L=document.querySelector(".left"), tp=L.querySelector(".top");
    document.documentElement.style.setProperty("--rtop",(tp.getBoundingClientRect().bottom-L.getBoundingClientRect().top-3)+"px"); }
  $("vWide").setAttribute("aria-pressed",wide);$("vPhone").setAttribute("aria-pressed",!wide);$("vWide").disabled=!canWide();
  $("vHint").textContent=canWide()?"":"widen the window to 900 px for two panels";
  const L={index:leftIndex,entry:leftEntry,catch:leftCatch,settings:wide?leftIndex:leftSettings}[S.view]();
  $("lcdL").innerHTML=L;
  if(wide){ $("lcdR").innerHTML={index:rightIndex,entry:rightEntry,catch:rightCatch,settings:rightSettings}[S.view]();
    $("rLabel").textContent=S.view==="settings"?t("settings").toUpperCase():t("info");
    keys(); const step=S.view==="entry"; $("yPrev").disabled=!step;$("yNext").disabled=!step;
    $("yPrev").innerHTML=`&#9664; ${esc(t("prev"))}`;$("yNext").innerHTML=`${esc(t("next"))} &#9654;`;
    $("rnum").textContent=step?short(S.cur):"–"; }
  const n=D.filter(x=>caught(x.id)).length;
  $("counter").innerHTML=`${n}/30<small>${esc(t("caught"))}</small>`;
  const a=t("catch"); $("lblA").textContent=a; $("lblA").classList.toggle("long",a.length>6);
  $("lblB").textContent=t("back"); $("pillPage").textContent=t("page"); $("pillPage").disabled=S.view!=="entry";
  document.documentElement.lang=S.lang;
}
function go(v,extra={}){ if(v!==S.view&&S.view!=="catch"&&S.view!=="settings")S.prev=S.view; Object.assign(S,extra,{view:v}); render(); }
function step(d){ const g=byId(S.cur).extra?EX:D; const i=g.findIndex(x=>x.id===S.cur); S.cur=g[(i+d+g.length)%g.length].id; S.stack=[]; render(); }
function toast(m){ const el=document.createElement("div");el.className="toast";el.textContent=m;$("lcdL").appendChild(el);setTimeout(()=>el.remove(),1300); }
function startCatch(file,forId){ S.dismissed=false; S.draft=file?URL.createObjectURL(file):null; S.catchFor=forId; S.draftSp=forId; go("catch"); }

/* ---------- events ---------- */
$("catchInput").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)startCatch(f,S.view==="entry"?S.cur:null);});
$("btnB").onclick=()=>{ if(S.view==="entry"){ if(S.stack.length){S.cur=S.stack.pop();render()} else go("index"); } else if(S.view==="catch"||S.view==="settings") go(S.prev); };
$("menuBtn").onclick=()=>{ S.view==="settings"?go(S.prev):go("settings"); };
$("pillPage").onclick=()=>{ if(S.view==="entry"){S.page^=1;render()} };
$("dL").onclick=()=>{ if(S.view==="entry")step(-1) }; $("dR").onclick=()=>{ if(S.view==="entry")step(1) };
$("dC").onclick=()=>{ if(S.view==="entry"&&!isWide()){S.page^=1;render()} };
$("dU").onclick=()=>document.querySelector("#lcdL .scroll")?.scrollBy({top:-160,behavior:"smooth"});
$("dD").onclick=()=>document.querySelector("#lcdL .scroll")?.scrollBy({top:160,behavior:"smooth"});
$("yPrev").onclick=()=>step(-1); $("yNext").onclick=()=>step(1);
$("vWide").onclick=()=>{S.wide=true;store.set("pzm.wide",true);render()}; $("vPhone").onclick=()=>{S.wide=false;store.set("pzm.wide",false);render()};
addEventListener("resize",render);
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o){ if(o.dataset.push&&S.view==="entry")S.stack.push(S.cur); else S.stack=[]; go("entry",{cur:+o.dataset.open,page:0}); return; }
  const f=e.target.closest("[data-filter]"); if(f){S.filter=f.dataset.filter;render();return;}
  const ef=e.target.closest("[data-edf]"); if(ef){S.edf=S.edf===ef.dataset.edf?null:ef.dataset.edf;render();return;}
  const l=e.target.closest("[data-lang]"); if(l){S.lang=l.dataset.lang;store.set("pzm.lang",S.lang);render();return;}
  const m=e.target.closest("[data-mode]"); if(m){S.mode=m.dataset.mode;store.set("pzm.mode",S.mode);render();return;}
  const p=e.target.closest("[data-pick]"); if(p){S.draftSp=+p.dataset.pick;render();return;}
  if(e.target.closest("[data-dismiss]")){S.dismissed=true;render();return;}
  if(e.target.closest("[data-save]")){ const id=+($("spc")?.value||S.draftSp||2); (S.finds[id]=S.finds[id]||[]).unshift({date:"2026-11-02"}); S.draft=null; go("entry",{cur:id,page:0}); toast(t("gotcha")); return; }
  if(e.target.closest("[data-recrop]")){ toast("✂"); }
});
document.addEventListener("change",e=>{
  if(e.target.id==="spc"){S.draftSp=+e.target.value;render();}
  if(e.target.dataset?.catchfor){const f=e.target.files[0];if(f)startCatch(f,+e.target.dataset.catchfor);}
  if(e.target.id==="rePick"){const f=e.target.files[0];if(f){S.draft=URL.createObjectURL(f);render();}}
});
render();
</script>
